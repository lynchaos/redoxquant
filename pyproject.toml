[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redoxquant"
version = "0.0.1"
description = "Open companion library for Amperia (RED) protein-quantification analysis exports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kemal Yaylalı" }]
keywords = ["bioprocess", "ligand-binding-assay", "5PL", "quantification", "electrochemical", "PAT"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "pandas>=1.5",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
dev = ["pytest>=7.4", "openpyxl>=3.1"]

[project.urls]
Homepage = "https://kemal.yaylali.uk"
Source = "https://github.com/lynchaos/redoxquant"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
